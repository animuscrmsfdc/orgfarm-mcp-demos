# Runs automatically when a PR is merged into main.
# Promotes the already-validated deployment from the PR check via Quick Deploy
# (no recompilation). Falls back to a full deploy only if no validated ID is found
# (e.g. manual workflow_dispatch without a prior validate run).

name: Deploy to Dev Org

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'force-app/**'
      - 'manifest/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    name: Deploy metadata to dev-org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set npm global prefix to home
        run: |
          npm config set prefix ~/.npm-global
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH

      - name: Cache sf CLI
        id: cache-sf
        uses: actions/cache@v6
        with:
          path: ~/.npm-global
          key: sf-cli-${{ runner.os }}-v7
          restore-keys: sf-cli-${{ runner.os }}-

      - name: Install sf CLI
        if: steps.cache-sf.outputs.cache-hit != 'true'
        run: npm install -g @salesforce/cli

      - name: Authenticate to dev org via SFDX Auth URL
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > /tmp/sfdx_auth.txt
          sf org login sfdx-url --sfdx-url-file /tmp/sfdx_auth.txt --alias dev-org --set-default
          rm /tmp/sfdx_auth.txt

      - name: Find validated deploy ID from most recent PR check
        id: find-deploy-id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list \
            --workflow validate-pr.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" \
              --name validated-deploy-id \
              --dir /tmp/validated-id 2>/dev/null || true
            DEPLOY_ID=$(cat /tmp/validated-id/validated-deploy-id.txt 2>/dev/null || echo "")
          fi

          echo "deploy_id=${DEPLOY_ID:-}" >> $GITHUB_OUTPUT

          if [ -n "${DEPLOY_ID:-}" ]; then
            echo "Using Quick Deploy with validated ID: $DEPLOY_ID (run $RUN_ID)"
          else
            echo "No validated deploy ID found — falling back to full deploy"
          fi

      - name: Quick deploy (promote validated package)
        if: steps.find-deploy-id.outputs.deploy_id != ''
        run: |
          sf project deploy quick \
            --job-id ${{ steps.find-deploy-id.outputs.deploy_id }} \
            --target-org dev-org \
            --wait 30 \
            --json

      - name: Full deploy (fallback — no validated package available)
        if: steps.find-deploy-id.outputs.deploy_id == ''
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org dev-org \
            --test-level RunLocalTests \
            --wait 30 \
            --json

      - name: Check if destructive changes manifest was modified
        id: check-destructive
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            if git diff --name-only HEAD~1 HEAD -- manifest/destructiveChanges.xml | grep -q .; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Apply destructive changes
        if: success() && steps.check-destructive.outputs.changed == 'true'
        run: |
          sf project deploy start \
            --manifest manifest/package-empty.xml \
            --post-destructive-changes manifest/destructiveChanges.xml \
            --target-org dev-org \
            --test-level RunLocalTests \
            --wait 30 \
            --json

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deploy failed. Check the logs above for details."
          exit 1

      - name: Job summary
        if: always()
        run: |
          DEPLOY_ID="${{ steps.find-deploy-id.outputs.deploy_id }}"
          if [ -n "$DEPLOY_ID" ]; then
            DEPLOY_MODE="Quick Deploy (promoted validated ID: $DEPLOY_ID)"
          else
            DEPLOY_MODE="Full deploy (fallback)"
          fi

          echo "## Deploy to Dev Org Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy mode | $DEPLOY_MODE |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy + tests | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Destructive changes | applied on success |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.actor }} on \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
